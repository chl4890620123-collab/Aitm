services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: aitm_db
      MARIADB_USER: aitm
      MARIADB_PASSWORD: ${AITM_DB_PASSWORD:?AITM_DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${AITM_DB_ROOT_PASSWORD:?AITM_DB_ROOT_PASSWORD is required}
    volumes:
      - aitm_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: ./demo/ai
    restart: unless-stopped
    environment:
      AITM_AI_SECURE_TOKEN: ${AITM_AI_SECURE_TOKEN:?AITM_AI_SECURE_TOKEN is required}
      BACKEND_URL: http://backend:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AITM_ALLOWED_VIDEO_HOSTS: ${AITM_ALLOWED_VIDEO_HOSTS:-storage.googleapis.com}
    volumes:
      - aitm_video_data:/app/data/videos:ro

  backend:
    build:
      context: ./demo
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      AITM_DB_URL: jdbc:mariadb://mariadb:3306/aitm_db?useUnicode=true&characterEncoding=UTF-8
      AITM_DB_USER: aitm
      AITM_DB_PASSWORD: ${AITM_DB_PASSWORD:?AITM_DB_PASSWORD is required}
      AITM_AI_ENGINE_URL: http://ai:8000/analyze-full
      AITM_AI_SECURE_TOKEN: ${AITM_AI_SECURE_TOKEN:?AITM_AI_SECURE_TOKEN is required}
      AITM_VIDEO_DIR: /app/data/videos
      AITM_ALLOWED_VIDEO_HOSTS: ${AITM_ALLOWED_VIDEO_HOSTS:-storage.googleapis.com}
      APP_DATABASE_CHARSET_MIGRATION_ENABLED: ${DB_CHARSET_MIGRATION_ENABLED:-false}
      APP_DATABASE_CHARSET_MIGRATION_LOCK_WAIT_SECONDS: ${DB_CHARSET_MIGRATION_LOCK_WAIT_SECONDS:-10}
    volumes:
      - aitm_video_data:/app/data/videos

  frontend:
    build:
      context: ./front
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${AITM_BIND_HOST:-127.0.0.1}:${AITM_FRONTEND_PORT:-15173}:80"

volumes:
  aitm_mariadb_data:
  aitm_video_data:
