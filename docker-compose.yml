services:
  mariadb:
    image: mariadb:10.11
    container_name: aitm-db
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MARIADB_DATABASE: aitm_db
      MARIADB_USER: aitm
      MARIADB_PASSWORD: ${AITM_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${AITM_DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  core-backend:
    build: ./demo
    container_name: aitm-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      RESTOK_DB_URL: jdbc:mariadb://mariadb:3306/aitm_db
      RESTOK_DB_USER: aitm
      RESTOK_DB_PASSWORD: ${AITM_DB_PASSWORD}
      RESTOK_AI_ENGINE_URL: http://ai-service:8000/analyze-full
      RESTOK_AI_SECURE_TOKEN: ${RESTOK_AI_SECURE_TOKEN}
      AITM_VIDEO_DIR: /data/videos
      AITM_ALLOWED_VIDEO_HOSTS: ${AITM_ALLOWED_VIDEO_HOSTS:-storage.googleapis.com}
    volumes:
      - video_data:/data/videos

  ai-service:
    build: ./demo/ai
    container_name: aitm-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESTOK_AI_SECURE_TOKEN: ${RESTOK_AI_SECURE_TOKEN}
      BACKEND_URL: http://core-backend:8080
      POSE_MODEL_PATH: /app/models/pose_landmarker_full.task
      AITM_MAX_ANALYSIS_SECONDS: 30
      AITM_ANALYSIS_FPS: 15
    volumes:
      - video_data:/data/videos:ro

  front-end:
    build: ./front
    container_name: aitm-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - core-backend

volumes:
  mariadb_data:
  video_data:
