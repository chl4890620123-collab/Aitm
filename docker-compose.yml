services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: restok_db
      MYSQL_ROOT_PASSWORD: ${RESTOK_DB_PASSWORD:?RESTOK_DB_PASSWORD is required}
    volumes:
      - "${AITM_DATA_ROOT:-C:/AITM/data}/mariadb:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  core-backend:
    build: ./demo
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/restok_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${RESTOK_DB_PASSWORD:?RESTOK_DB_PASSWORD is required}
      RESTOK_AI_ENGINE_URL: http://ai-service:8000/analyze-full
      RESTOK_AI_SECURE_TOKEN: ${RESTOK_AI_SECURE_TOKEN:?RESTOK_AI_SECURE_TOKEN is required}
      RESTOK_VIDEO_SIGNING_KEY: ${RESTOK_VIDEO_SIGNING_KEY:?RESTOK_VIDEO_SIGNING_KEY is required}
      RESTOK_VIDEO_STORAGE_PATH: /data/videos
      RESTOK_VIDEO_ALLOWED_HOSTS: ${RESTOK_VIDEO_ALLOWED_HOSTS:-localhost,127.0.0.1,s3.amazonaws.com,storage.googleapis.com}
      RESTOK_CORS_ALLOWED_ORIGINS: ${RESTOK_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - "${AITM_DATA_ROOT:-C:/AITM/data}/videos:/data/videos"

  ai-service:
    build: ./demo/ai
    restart: unless-stopped
    depends_on:
      - core-backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALLOW_OPENAI_EGRESS: ${ALLOW_OPENAI_EGRESS:-false}
      RESTOK_AI_SECURE_TOKEN: ${RESTOK_AI_SECURE_TOKEN:?RESTOK_AI_SECURE_TOKEN is required}
      BACKEND_URL: http://core-backend:8080
      RAG_CACHE_SECONDS: ${RAG_CACHE_SECONDS:-300}
    volumes:
      - "${AITM_DATA_ROOT:-C:/AITM/data}/videos:/data/videos:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  front-end:
    build: ./front
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      AITM_APP_USERNAME: ${AITM_APP_USERNAME:?AITM_APP_USERNAME is required}
      AITM_APP_PASSWORD: ${AITM_APP_PASSWORD:?AITM_APP_PASSWORD is required}
    depends_on:
      - core-backend
