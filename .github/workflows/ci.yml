name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  text-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate UTF-8, JSON and runtime wiring
        run: |
          python scripts/check_text_integrity.py
          ignored="$(git ls-files -ci --exclude-standard)"
          if [ -n "$ignored" ]; then
            echo "Tracked files are ignored by .gitignore:"
            echo "$ignored"
            exit 1
          fi
          grep -q 'proxy_pass http://backend:8080;' front/nginx.conf
          if grep -q 'core-backend' front/nginx.conf; then
            echo 'front/nginx.conf still references the removed core-backend hostname.'
            exit 1
          fi
          grep -q 'RESTOK_DB_URL:' docker-compose.yml
          grep -q 'RESTOK_DB_USER:' docker-compose.yml
          grep -q 'RESTOK_DB_PASSWORD:' docker-compose.yml
          grep -q 'RESTOK_AI_ENGINE_URL: http://ai:8000/analyze-full' docker-compose.yml
          grep -q 'APP_DATABASE_CHARSET_MIGRATION_ENABLED: ${DB_CHARSET_MIGRATION_ENABLED:-false}' docker-compose.yml
          if grep -Eq '^\s+(DB_URL|DB_USERNAME|DB_PASSWORD|AI_SERVICE_URL):' docker-compose.yml; then
            echo 'docker-compose.yml contains obsolete backend environment variable names.'
            exit 1
          fi
          grep -q '@Value("${app.database.charset-migration.enabled:false}")' demo/src/main/java/com/example/demo/config/DatabaseCharsetMigration.java

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo/pom.xml
      - name: Test backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install frontend dependencies
        run: npm ci || npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/ai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install AI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import and compile AI service
        run: |
          python -m compileall -q .
          python -c "import cv2, faiss, fastapi, langchain_community, langchain_openai, mediapipe, numpy, openai, pydantic, requests; import main"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose
        env:
          AITM_DB_ROOT_PASSWORD: ci-root-password
          AITM_DB_PASSWORD: ci-app-password
          RESTOK_AI_SECURE_TOKEN: ci-secure-token
        run: docker compose config >/dev/null
      - name: Build all service images
        env:
          AITM_DB_ROOT_PASSWORD: ci-root-password
          AITM_DB_PASSWORD: ci-app-password
          RESTOK_AI_SECURE_TOKEN: ci-secure-token
        run: docker compose build
