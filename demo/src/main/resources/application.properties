spring.application.name=aitm-core

spring.datasource.url=${RESTOK_DB_URL:jdbc:mariadb://localhost:3308/aitm_db}
spring.datasource.username=${RESTOK_DB_USER:aitm}
spring.datasource.password=${RESTOK_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

restok.ai.secure-token=${RESTOK_AI_SECURE_TOKEN}
restok.ai.engine-url=${RESTOK_AI_ENGINE_URL:http://localhost:8000/analyze-full}

aitm.storage.video-dir=${AITM_VIDEO_DIR:./data/videos}
aitm.storage.max-file-size-bytes=524288000
aitm.security.allowed-video-hosts=${AITM_ALLOWED_VIDEO_HOSTS:storage.googleapis.com}

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

server.port=8080
