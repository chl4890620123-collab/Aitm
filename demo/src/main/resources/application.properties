spring.application.name=restok-ai-engine
spring.datasource.url=${RESTOK_DB_URL:jdbc:mariadb://localhost:3308/restok_db}
spring.datasource.username=${RESTOK_DB_USER:root}
spring.datasource.password=${RESTOK_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
restok.ai.secure-token=${RESTOK_AI_SECURE_TOKEN}
restok.ai.engine-url=${RESTOK_AI_ENGINE_URL:http://localhost:8000/analyze-full}
restok.video.storage-path=${RESTOK_VIDEO_STORAGE_PATH:/data/videos}
restok.video.allowed-hosts=${RESTOK_VIDEO_ALLOWED_HOSTS:localhost,127.0.0.1,s3.amazonaws.com,storage.googleapis.com}
restok.cors.allowed-origins=${RESTOK_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
server.port=8080
